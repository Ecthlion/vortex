# Example decoder kernel for the `vortex.fastlanes.bitpacked` encoding. Links the same
# `fastlanes` crate the native encoding uses, so the packed layout is bit-for-bit identical.
# Build with:
#   cargo build -p bitpacked-kernel --target wasm32-unknown-unknown --release
#
# Excluded from the main workspace (see the root Cargo.toml `exclude`); only meaningful for wasm32.

[workspace]

[package]
name = "bitpacked-kernel"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
fastlanes = "0.5"
# `runtime` off: fastlanes' num-traits dependency links `std` (it does not set
# `default-features = false`), so the SDK's allocator/panic handler would collide with std's.
# Fixing that upstream in fastlanes-rs would let this kernel go fully no_std too.
vortex-wasm-guest = { path = "../..", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
